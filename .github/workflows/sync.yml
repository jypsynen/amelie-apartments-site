name: Sync Booking.com calendars
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read calendars
        env:
          ICAL_FEEDS: ${{ secrets.ICAL_FEEDS }}
        run: node scripts/sync.js
      - name: Save changes
        run: |
          git config user.name "calendar-sync"
          git config user.email "calendar-sync@users.noreply.github.com"
          git add busy.json
          git diff --cached --quiet || (git commit -m "Update booked dates" && git push)
